name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Ephemeral database that lives only for this job: password-free local auth, no credential in the repo.
          POSTGRES_USER: postgres
          POSTGRES_DB: nihongo_mock_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nihongo_mock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/nihongo_mock_test
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/nihongo_mock_test
      APP_URL: http://localhost:3000
      LOG_LEVEL: warn
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generate a per-run Payload secret
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Apply migrations
        run: pnpm migrate

      - name: Integration tests
        run: pnpm test:int

      - name: Check for schema changes without a migration
        run: |
          pnpm payload migrate:create ci_drift_check --skip-empty
          if ls src/migrations/*ci_drift_check* >/dev/null 2>&1; then
            echo "::error::The Payload config changed without a migration. Run 'pnpm migrate:create <name>' and commit it."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
